version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Las actualizaciones menores y de parche se agrupan en una sola propuesta.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Los tipos de Node deben coincidir con la versión de Node que usamos (.nvmrc: 22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      acciones:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Un salto mayor de una acción de la integración continua se revisa a mano.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(ci)"
